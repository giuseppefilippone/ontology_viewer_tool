<p><b>SPARQL</b> over the indexed closure (rdflib engine).</p>

<li>SELECT / ASK / CONSTRUCT with the usual prefixes pre-declared (<code>sdf:</code>, <code>cls:</code>, <code>ind:</code>, <code>owl:</code>, <code>rdfs:</code>…); autocomplete inserts prefixed entity names.</li>
